name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Run test suite
        run: pytest -v
      - name: Verify seeder produces stable demo data
        run: python -m app.seeder

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install semgrep
      - name: Semgrep scan (DevGuardian guards itself)
        # Informational gate: reports findings as annotations but does not fail
        # the build, so the scan never blocks a submission. Flip to blocking by
        # removing continue-on-error once the codebase is Semgrep-clean.
        continue-on-error: true
        run: semgrep --config=auto --error --exclude=demo_fixtures .
