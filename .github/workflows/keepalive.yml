name: Keep-alive (Render free tier)

# Pings the deployed /health endpoint so a free-tier Render web service does not
# spin down after ~15 min idle (which causes a slow cold start and can make the
# first GitHub webhook time out). Set the repo variable RENDER_URL after deploy:
#   repo → Settings → Secrets and variables → Actions → Variables → New variable
#   name: RENDER_URL   value: https://<your-app>.onrender.com
on:
  schedule:
    - cron: "*/12 * * * *"   # every 12 minutes (GitHub may delay scheduled runs)
  workflow_dispatch:          # allow manual "Run workflow"

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /health to prevent idle spin-down
        env:
          URL: ${{ vars.RENDER_URL }}
        run: |
          if [ -z "$URL" ]; then
            echo "RENDER_URL not set — skipping (set it under repo Variables after deploy)."
            exit 0
          fi
          echo "Pinging $URL/health"
          # generous timeout to absorb a cold start; never fail the workflow
          curl -fsS --max-time 90 "$URL/health" && echo "  -> awake" || echo "  -> no response (likely cold-starting)"
